<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OAuth Home</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>OAuth Security</h1>

        <p>
            Google OAuth 2.0
        </p>

        <div class="status">

            <span>
                Authentication Status
            </span>

            <strong
                    th:text="${authenticated
                    ? 'Authenticated'
                    : 'Not Authenticated'}">

                Not Authenticated

            </strong>

        </div>

        <a
                th:if="${!authenticated}"
                href="/oauth2/authorization/google"
                class="button login">

            Login with OAuth

        </a>

        <a
                th:if="${authenticated}"
                href="/dashboard"
                class="button login">

            Open Dashboard

        </a>

    </div>

</div>

</body>

</html>
